[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "afterhours"
version = "0.1.0"
description = "Local-first agentic DJ engine with a VirtualDJ OSC adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=11.3,<13", "numpy>=2.3,<3"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
afterhours = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/assets/*.jpg",
    "web/assets/*.png",
    "web/media/*.mp4",
    "crowd_web/*.html",
    "crowd_web/*.css",
    "crowd_web/*.mjs",
]
