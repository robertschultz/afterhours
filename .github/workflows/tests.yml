name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulated-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./setup
      - run: .venv/bin/python scripts/test-python.py
      - run: npm test
